<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>travel form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>TRAVEL FORM</h1>
    <form>
        <div>
        <label for="name">Name</label>
        <input id="Name" type="text" placeholder="PLEASE ENTER YOUR NAME" required></div>
        <div>
            <label for="total">TOTAL PEOPLE</label>
            <input id="total" type="number" min="1" step="1" placeholder="NUMBER OF PEOPLE" required>
        </div>
        <div>
            <label for="destination">DESTINATION</label>
            <select id="destination" required>
                <option value="BANGLORE">BANGLORE</option>
                <option VALUE="DELHI">delhi</option>
                <option VALUE="KASHMIR" name="destination">kashmir</option>
                <option VALUE="SHIMLA">shimala</option>
                <option VALUE="CHANDIGARH">chandigarh</option>
            </select></div>
            <div>
            <label for="PB">PHONE NUMBER</label>
            <input id="PH" type="phone number"  placeholder="enter ur phone number" required>
        </div>
        <div>
            <label for="email">email id</label>
            <input id="=email" type="email" placeholder="ennter your email" required>
        </div>
<div>
            <label for="starting">starting destination</label>
            <input id="starting" type="text"  placeholder="please enter your destination" required>
        </div>
        <div>
            <button type="submit">submit</button>
        </div>
    </form>
</body>
</html>
